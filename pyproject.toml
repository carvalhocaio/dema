[project]
name = "dema"
version = "0.1.0"
description = "Brazilian presidential election vote tallying simulator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2",
    "polars>=2.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.12",
    "pydantic-settings>=2.10",
    "redis>=6",
]

[project.scripts]
dema = "dema.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dema"]

[dependency-groups]
dev = [
    "pip-audit>=2.10.0",
    "pre-commit>=4.0.0",
    "pyright>=1.1.390",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.15.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
    "C4",  # flake8-comprehensions
    "RET", # flake8-return
    "TID", # flake8-tidy-imports
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

markers = ["integration: requires running Postgres and Redis (make up)"]
